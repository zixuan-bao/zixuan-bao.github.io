{{ $js := resources.Get "js/site.js" | minify | fingerprint }}
<script defer src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>
{{ $analytics := hugo.Data.integrations.analytics }}
{{ if $analytics.enabled }}
  {{ if and (eq $analytics.provider "plausible") $analytics.script_url $analytics.domain }}<script defer data-domain="{{ $analytics.domain }}" src="{{ $analytics.script_url }}"></script>{{ end }}
{{ end }}
